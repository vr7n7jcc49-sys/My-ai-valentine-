<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Veru ❤️</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            font-family: sans-serif;
            background: linear-gradient(to bottom, #ffe6eb, #fff);
            overflow: hidden;
            margin: 0;
        }
        h1 { margin-bottom: 40px; color: #333; }
        .buttons { position: relative; height: 100px; width: 300px; }
        button {
            padding: 14px 24px;
            border-radius: 12px;
            border: none;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .yes { background: #ff4d6d; color: white; }
        .yes:hover { transform: scale(1.1); }
        .no { background: #ccc; position: absolute; }
        .hearts span {
            font-size: 24px;
            display: inline-block;
            margin: 5px;
            animation: float 3s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(-20px); opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div id="content">
        <h1>Veru, budeš moje Valentýnka? 💕</h1>
        <div class="buttons">
            <button class="yes" onclick="handleYes()">Ano 💖</button>
            <button class="no" id="noBtn" onmousemove="moveNoButton()">Ne 🙈</button>
        </div>
    </div>

    <script>
        function moveNoButton() {
            const btn = document.getElementById('noBtn');
            const newX = Math.random() * (window.innerWidth - 100);
            const newY = Math.random() * (window.innerHeight - 60);
            btn.style.left = newX + 'px';
            btn.style.top = newY + 'px';
            btn.style.position = 'fixed';
        }

        function handleYes() {
            document.getElementById('content').innerHTML = `
                <div style="animation: fadeIn 0.8s ease-in-out;">
                    <h1>Nejlepší rozhodnutí vůbec. Miluju tě ❤️</h1>
                    <p style="font-size: 1.2rem;">Buď připravená na večeři příští týden!</p>
                    <div class="hearts">
                        ${'<span>💖</span>'.repeat(20)}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
